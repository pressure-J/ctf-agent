version: "3.8"
services:
  backend:
    build: .
    ports:
      - "8081:8080"          # 宿主8080已被本机 cyberstrike-ai(Go版) 占用, 故映射8081
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_API_BASE=${DEEPSEEK_API_BASE:-https://api.deepseek.com}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./data:/app/data          # 数据持久化: SQLite + checkpoints 不随容器销毁
    restart: unless-stopped

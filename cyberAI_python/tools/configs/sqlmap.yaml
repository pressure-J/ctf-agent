name: sqlmap_check
description: 基于SQLMap的SQL注入检测工具
category: injection
command: sqlmap
args: ["--batch"]
timeout: 300
enabled: true
parameters:
  - name: url
    type: string
    description: 目标URL
    required: true
  - name: level
    type: integer
    description: 检测深度(1-5)
    required: false
  - name: risk
    type: integer
    description: 风险等级(1-3)
    required: false
